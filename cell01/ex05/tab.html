<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        table, td {
            width: 100%;
            border: 1px solid black;
            border-collapse: collapse;
        }
        td { 
            width: 50%;
            padding: 40px 20px;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td style="background-color: greenyellow;">First cell</td>
            <td style="background-color: palevioletred;">Second cell</td>
        </tr>
    </table>
</body>
</html>

<!-- 
 td = table data
 tr = table row

 border: 1px solid black;
 1px = กำหนดความหนาเส้นขอบ
 solid = เส้นขอบเป็นเส้นทึบ 
 black = สีของเส้นขอบเป็นสีดำ

 border-collapse: collapse;
 เส้นขอบของเซลล์ตาราง (<td> หรือ <th>) รวมเป็นเส้นขอบของตารางหลัก (<table>)
-->
